<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Entrer - DreamPark</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .section { border: 1px solid #ccc; padding: 15px; margin: 10px 0; }
    .hidden { display: none; }
    input, select { padding: 5px; margin: 5px 0; }
  </style>
</head>
<body>
  <h1>Entrer dans le parking</h1>

  <form method="post">
    {% csrf_token %}
    
    <div class="section">
      <h3>Informations du véhicule</h3>
      <label>Plaque d'immatriculation : 
        <input type="text" name="plate_number" required>
      </label><br><br>
      
      <label>Longueur (m) : 
        <input type="number" step="0.01" name="length" required>
      </label><br><br>
      
      <label>Hauteur (m) : 
        <input type="number" step="0.01" name="height" required>
      </label><br>
    </div>

    <div class="section">
      <h3> Abonnement (optionnel)</h3>
      <label>
        <input type="checkbox" name="has_subscription" id="has_subscription">
        Je veux m'abonner
      </label><br><br>

      <div id="subscription_form" class="hidden">
        <label>Nom complet : 
          <input type="text" name="abonne_nom">
        </label><br><br>
        
        <label>Email : 
          <input type="email" name="abonne_email">
        </label><br><br>
        
        <label>Plan d'abonnement :
          <select name="plan_type">
            <option value="">-- Sélectionner --</option>
            <option value="STANDARD">Abonné Standard (50€/mois)</option>
            <option value="GUARANTEED">Pack Garanti (100€/mois)</option>
          </select>
        </label><br>
      </div>
    </div>

    <button type="submit">Se garer</button>
  </form>

  <script>
    // Affiche/cache le formulaire d'abonnement
    document.getElementById('has_subscription').addEventListener('change', function() {
      const form = document.getElementById('subscription_form');
      if (this.checked) {
        form.classList.remove('hidden');
      } else {
        form.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
