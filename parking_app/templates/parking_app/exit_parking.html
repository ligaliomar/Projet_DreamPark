<h2>Sortir du parking</h2>

{% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}

{% if success %}
    <p style="color:green;">{{ success }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}
    <label>Numéro d'immatriculation :</label>
    <input type="text" name="plate_number" required>
    <button type="submit">Sortir</button>
</form>
