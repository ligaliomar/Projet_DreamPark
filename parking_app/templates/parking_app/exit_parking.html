<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Sortie - DreamPark</title>
</head>
<body>
  <h1>Sortir du parking</h1>

  {% if error %}
    <p style="color: red">{{ error }}</p>
  {% endif %}
  {% if success %}
    <p style="color: green">{{ success }}</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <label>Numéro d'immatriculation : <input type="text" name="plate_number" required></label><br><br>
    <button type="submit">Sortir</button>
  </form>
</body>
</html>
